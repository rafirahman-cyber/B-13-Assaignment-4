<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTracker Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="w-[80%] mx-auto mt-8 p-6">
        <h1 class="text-3xl font-bold text-slate-900 mb-6">Job Application Tracker</h1>
        <div class="grid grid-cols-3 gap-8">
            <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-100">
                <p>Total</p>
                <p id="total">8</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-100">
                <p>Interview</p>
                <p id="interview-count">0</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-100">
                <p>Rejected</p>
                <p id="rejected-count">0</p>
            </div>
        </div>
    </header>
<hr>
    <main class="w-[80%] mx-auto">
        <div>
            <button>All</button>
        </div>
    </main>


    <script src="/script.js"></script>
</body>
</html>
