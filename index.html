<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTracker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>

<body class="text-slate-800">
    <div class="max-w-6xl mx-auto mt-8 p-6">
        
                <h1 class="text-3xl font-bold text-slate-900 mb-6">Job Application Tracker</h1>
            <div class="grid grid-cols-3 gap-8">
                <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-100">
                    <p class="text-sm text-slate-500 font-medium mb-1">Total</p>
                    <p id="total-count" class="text-3xl font-bold text-blue-900">0</p>
                </div>

                <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-100">
                    <p class="text-sm text-slate-500 font-medium mb-1">Interview</p>
                    <p id="interview-count" class="text-2xl font-bold text-green-500">0</p>
                </div>

                <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-100">
                    <p class="text-sm text-slate-500 font-medium mb-1">Rejected</p>
                    <p id="rejected-count" class="text-2xl font-bold text-red-500">0</p>
                </div>
            </div>
        

        <div class="mt-8 flex justify-between items-center border-b border-slate-200 pb-2">
            <h2 class="text-lg font-bold text-slate-900">Available Jobs</h2>
            <span id="showing-count" class="text-sm text-slate-500">8 jobs</span>
        </div>


        <div class="flex space-x-2 mb-6 mt-3">
            <button onclick="setFilter('All')" id="btn-all" class="px-6 py-1.5 text-sm font-medium rounded bg-blue-500 text-white transition-colors">All</button>
            <button onclick="setFilter('Interview')" id="btn-interview" class="px-6 py-1.5 text-sm font-medium rounded bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors">Interview</button>
            <button onclick="setFilter('Rejected')" id="btn-rejected" class="px-6 py-1.5 text-sm font-medium rounded bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors">Rejected</button>
        </div>

        <div id="job-list" class="space-y-4">
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
